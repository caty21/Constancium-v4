<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <script>
      const pagePath = window.location.pathname.replace(/\/+$/, "") || "/";
      const heroImageByRoute = {
        "/": "/home-hero.webp",
        "/gamme": "/gamme-hero.webp",
      };
      const heroImage = heroImageByRoute[pagePath];
      if (heroImage) {
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.href = heroImage;
        preload.type = "image/webp";
        preload.media = "(min-width: 1024px)";
        preload.setAttribute("fetchpriority", "high");
        document.head.appendChild(preload);
      }
    </script>
    <title>Constancium - Gestion de Patrimoine d'Excellence</title>
    <meta name="description" content="Constancium, votre partenaire en gestion de patrimoine. Expertise financière, conseil personnalisé et solutions sur-mesure pour faire fructifier votre patrimoine en toute confiance.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
